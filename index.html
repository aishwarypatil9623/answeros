<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnswerOS</title>
</head>
<body>
  <p>Opening AnswerOS Dashboard…</p>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          await navigator.serviceWorker.register('sw.js', { scope: './' });
          await navigator.serviceWorker.ready;
        }
      } catch (e) {
        console.warn('AnswerOS live adapter registration failed:', e);
      }
      location.replace('answeros-dashboard.html');
    })();
  </script>
</body>
</html>
