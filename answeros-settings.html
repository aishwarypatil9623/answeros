<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AnswerOS — Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#14532d; --green-800:#1c5c30; --green-700:#1f7a3d; --green-600:#2c8a46;
    --green-100:#e6f4ea; --green-50:#f3faf5;
    --ink-900:#14171a; --ink-700:#3c4247; --ink-500:#6b7278; --ink-300:#a2a8ad;
    --line:#e7eae8; --bg:#f6f8f6; --card:#ffffff;
    --red:#b3402c; --red-50:#fbf1ee; --amber:#c98a1f; --amber-50:#fbf5e8;
    --blue:#3b6fd5; --purple:#7a4fd5;
    --shadow: 0 1px 2px rgba(20,23,26,0.04), 0 6px 20px rgba(20,23,26,0.05);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink-900);font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  body.dark{--bg:#14171a;--card:#1c2023;--ink-900:#f2f4f2;--ink-700:#c7ccc9;--ink-500:#8b928d;--line:#2a2f31;}
  body.dark .sidebar{background:#1a1e20;}
  body.dark .s-field input, body.dark .s-field select, body.dark .s-field textarea{background:#14171a;color:#f2f4f2;border-color:#2a2f31;}
  body.dark .seg-btn{background:#1c2023;border-color:#2a2f31;color:#c7ccc9;}
  body.dark .seg-btn.active{background:var(--green-700);color:#fff;}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-width:1180px;}

  .sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px 8px;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--green-600),var(--green-900));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow);}
  .brand-text .name{font-weight:700;font-size:15px;letter-spacing:-0.02em;color:var(--ink-900);line-height:1.1;}
  .brand-text .sub{font-size:11px;color:var(--ink-500);margin-top:2px;}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink-700);font-size:13.5px;font-weight:500;cursor:pointer;user-select:none;transition:background .12s ease,color .12s ease;}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.75;}
  .nav-item:hover{background:var(--green-50);color:var(--green-800);}
  .nav-item.active{background:var(--green-100);color:var(--green-800);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-spacer{flex:1;}
  .side-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:10px;}
  .user-row{display:flex;align-items:center;gap:10px;padding:6px 8px;}
  .avatar-wrap{position:relative;cursor:pointer;}
  .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#f0b7c4,#e08fa6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;}
  .avatar-edit{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;background:var(--green-700);display:flex;align-items:center;justify-content:center;}
  .avatar-edit svg{width:9px;height:9px;color:#fff;}
  .user-row .uname{font-weight:600;font-size:12.5px;}
  .user-row .urole{font-size:11px;color:var(--ink-500);}
  .quote-card{margin-top:12px;background:var(--green-900);color:#e9f5ec;border-radius:12px;padding:14px;font-size:12px;line-height:1.55;}
  .quote-card .mark{font-size:20px;opacity:.5;line-height:0;display:block;margin-bottom:2px;}
  .quote-card .attrib{margin-top:8px;font-size:10.5px;color:#a9d3b4;}

  main{padding:22px 30px 60px 30px;max-width:1200px;}
  .pagehead h1{font-size:22px;margin:0 0 4px 0;letter-spacing:-0.02em;}
  .pagehead p{margin:0 0 24px 0;color:var(--ink-500);font-size:12.5px;}

  /* settings layout */
  .settings-layout{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start;}
  .settings-nav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;}
  .sn-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--ink-700);cursor:pointer;}
  .sn-item:hover{background:var(--green-50);}
  .sn-item.active{background:var(--green-100);color:var(--green-800);font-weight:600;}
  .sn-item svg{width:15px;height:15px;flex-shrink:0;}

  /* panels */
  .settings-panel{display:none;}
  .settings-panel.active{display:flex;flex-direction:column;gap:16px;}
  .s-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;}
  .s-card-head{margin-bottom:16px;}
  .s-card-head h3{font-size:14px;font-weight:700;margin:0 0 3px 0;letter-spacing:-0.01em;}
  .s-card-head p{font-size:11.5px;color:var(--ink-500);margin:0;}
  .s-divider{height:1px;background:var(--line);margin:14px 0;}
  .s-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:6px 0;}
  .s-row-label{font-size:13px;font-weight:600;color:var(--ink-900);}
  .s-row-sub{font-size:11px;color:var(--ink-500);margin-top:2px;}
  .s-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .s-field:last-child{margin-bottom:0;}
  .s-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-500);}
  .s-field input, .s-field select, .s-field textarea{padding:9px 11px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-family:inherit;outline:none;width:100%;}
  .s-field input:focus, .s-field select:focus, .s-field textarea:focus{border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100);}
  .s-field textarea{resize:vertical;min-height:70px;}
  .s-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .s-field-inline{display:flex;align-items:center;gap:10px;}
  .s-field-inline input{width:90px;}

  /* toggle switch */
  .toggle{width:38px;height:22px;border-radius:20px;background:#d6dbd7;position:relative;cursor:pointer;transition:background .15s ease;flex-shrink:0;}
  .toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s ease;}
  .toggle.on{background:var(--green-600);}
  .toggle.on::after{left:18px;}

  /* segmented control */
  .seg{display:flex;gap:4px;background:#f0f2ee;border-radius:9px;padding:3px;}
  .seg-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-500);cursor:pointer;border:none;background:transparent;font-family:inherit;}
  .seg-btn.active{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(0,0,0,.1);}

  /* save bar */
  .save-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--green-50);border:1px solid var(--green-100);border-radius:10px;margin-top:4px;}
  .save-bar p{margin:0;font-size:12px;color:var(--green-800);}
  .save-btn{background:var(--green-700);color:#fff;border:none;border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .save-btn:hover{background:var(--green-800);}

  /* sync section */
  .sync-url-row{display:flex;gap:8px;}
  .sync-url-row input{flex:1;}
  .sync-test-btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .sync-test-btn:hover{border-color:var(--green-600);}
  .sync-status{margin-top:8px;font-size:11.5px;}
  .sync-status.ok{color:var(--green-700);}
  .sync-status.err{color:var(--red);}

  /* danger zone */
  .danger-btn{background:var(--red-50);color:var(--red);border:1px solid #e3b3a5;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .danger-btn:hover{background:#f6dcd5;}

  /* about */
  .about-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .about-tile{background:#fbfbf9;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;}
  .about-tile .av{font-size:18px;font-weight:800;letter-spacing:-0.02em;}
  .about-tile .al{font-size:10.5px;color:var(--ink-500);margin-top:2px;}
  .about-pages{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .about-page-chip{background:var(--green-50);color:var(--green-800);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink-900);color:#fff;font-size:12.5px;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);transition:all .2s ease;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dcd8;border-radius:8px;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🌱</div>
      <div class="brand-text"><div class="name">AnswerOS</div><div class="sub">Answer Writing Tracker</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="nav-spacer"></div>
    <div class="side-foot">
      <div class="user-row">
        <div class="avatar-wrap" id="avatarWrap">
          <div class="avatar" id="avatarDisplay">AP</div>
          <div class="avatar-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></div>
        </div>
        <div>
          <div class="uname" id="sidebarName">Aishwary Patil</div>
          <div class="urole" id="sidebarRole">UPSC Aspirant 🎯</div>
        </div>
      </div>
      <div class="quote-card">
        <span class="mark">"</span>
        <span id="sidebarQuote">Discipline today shapes the freedom of your future.</span>
        <div class="attrib">— Your Future Self</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="pagehead">
      <h1>Settings</h1>
      <p>Personalise AnswerOS — your profile, appearance, sync, targets, and data.</p>
    </div>

    <div class="settings-layout">
      <!-- settings nav -->
      <div class="settings-nav" id="settingsNav"></div>

      <!-- panels -->
      <div id="panelContainer"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Settings — all state lives in a single CONFIG object.
   Persists in memory only (same limitation as other pages).
   Export/import buttons let you back up + restore settings
   as a JSON blob — real persistence without needing a tab.
============================================================ */
let CONFIG = {
  // Profile
  name: 'Aishwary Patil',
  role: 'UPSC Aspirant',
  emoji: '🎯',
  email: 'aishwaryspatil2003@gmail.com',
  examYear: '2027',
  optionalSubject: 'PSIR (Political Science & International Relations)',
  targetService: 'IFS (Indian Foreign Service)',
  motto: 'Discipline today shapes the freedom of your future.',

  // Appearance
  theme: 'light',
  accentColor: '#2c8a46',
  fontSize: 'medium',
  sidebarQuote: true,

  // Targets
  dailyAnswerTarget: 2,
  weeklyAnswerTarget: 10,
  monthlyAnswerTarget: 40,
  minScoreTarget: 6,
  prelims: '2027-05-23',
  mains: '2027-08-20',

  // Sync
  syncUrl: '',
  syncToken: '',
  autoSyncEnabled: false,
  syncIntervalMinutes: 30,

  // Pages visibility
  pagesVisible: {
    dashboard: true, allAnswers: true, analytics: true,
    pyqTracker: true, learnings: true, revisionHub: true,
    flashcards: true, calendar: true, goals: true
  },

  // Flashcard preferences
  fcDefaultDeck: 'all',
  fcShowPaper: true,
  fcShowSubtopic: true,

  // Analytics preferences
  scoreThreshold: 6,
  showSampleBanners: true,

  // Quote
  customQuotes: [
    'Discipline today shapes the freedom of your future.',
    'A rank is built one answer at a time.',
    'Toppers revise. Others just read.',
    'Rankers aren\'t the ones who read the most — they\'re the ones who revise the recurring themes till they\'re reflexes.',
  ],
  activeQuoteIndex: 0,
};

/* ---------- nav ---------- */
function navIcon(name){
  const p = {
    grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    bar:'<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
    archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8M10 13h4"/>',
    book:'<path d="M4 4.5A2.5 2.5 0 016.5 2H20v18H6.5A2.5 2.5 0 004 17.5v-13z"/><path d="M4 17.5A2.5 2.5 0 016.5 15H20"/>',
    refresh:'<path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/>',
    layers:'<path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/>',
    cal2:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    flag:'<path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p[name]}</svg>`;
}
document.getElementById('nav').innerHTML = [
  ['Dashboard','grid','answeros-dashboard.html'],['All Answers','list','answeros-all-answers.html'],['Analytics','bar','answeros-analytics.html'],
  ['PYQ Tracker','archive','answeros-pyq-tracker.html'],['Learnings','book','answeros-learnings.html'],['Revision Hub','refresh','answeros-revision-hub.html'],['Flashcards','layers','answeros-flashcards.html'],
  ['Calendar','cal2','answeros-calendar.html'],['Goals','flag','answeros-goals.html'],['Settings','gear','answeros-settings.html',true]
].map(([label,ic,href,active])=> href
    ? `<a href="${href}" class="nav-item ${active?'active':''}" style="text-decoration:none;">${navIcon(ic)}<span>${label}</span></a>`
    : `<div class="nav-item" style="opacity:.55;cursor:default;">${navIcon(ic)}<span>${label}</span></div>`
).join('');

/* ---------- settings nav sections ---------- */
const SECTIONS = [
  {key:'profile', label:'Profile', icon:'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>'},
  {key:'appearance', label:'Appearance', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 3v9l4.5 4.5"/>'},
  {key:'targets', label:'Targets & Exam', icon:'<path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/>'},
  {key:'sync', label:'Live Sync', icon:'<path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/>'},
  {key:'pages', label:'Page Visibility', icon:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'},
  {key:'quotes', label:'Motivational Quotes', icon:'<path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/>'},
  {key:'data', label:'Data & Export', icon:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'},
  {key:'about', label:'About AnswerOS', icon:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'},
];
let activeSection = 'profile';
document.getElementById('settingsNav').innerHTML = SECTIONS.map(s=>
  `<div class="sn-item ${s.key===activeSection?'active':''}" data-section="${s.key}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">${s.icon}</svg>
    ${s.label}
  </div>`
).join('');
document.getElementById('settingsNav').addEventListener('click', e=>{
  const item = e.target.closest('[data-section]'); if(!item) return;
  activeSection = item.dataset.section;
  document.querySelectorAll('.sn-item').forEach(el=>el.classList.toggle('active', el===item));
  renderPanel();
});

/* ---------- helpers ---------- */
function toggle(id, configKey, callback){
  const el = document.getElementById(id);
  if(!el) return;
  if(CONFIG[configKey]) el.classList.add('on'); else el.classList.remove('on');
  el.addEventListener('click', ()=>{
    CONFIG[configKey] = !CONFIG[configKey];
    el.classList.toggle('on', CONFIG[configKey]);
    if(callback) callback(CONFIG[configKey]);
  });
}
function seg(id, configKey, callback){
  document.querySelectorAll(`[data-seg="${id}"]`).forEach(btn=>{
    if(btn.dataset.val===String(CONFIG[configKey])) btn.classList.add('active');
    btn.addEventListener('click', ()=>{
      CONFIG[configKey] = btn.dataset.val;
      document.querySelectorAll(`[data-seg="${id}"]`).forEach(b=>b.classList.toggle('active', b===btn));
      if(callback) callback(CONFIG[configKey]);
    });
  });
}
function showToast(msg, ms=2800){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}
function applyTheme(t){ document.body.classList.toggle('dark', t==='dark'); }

/* ---------- render panel ---------- */
function renderPanel(){
  const c = document.getElementById('panelContainer');

  if(activeSection==='profile'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Your Profile</h3><p>How you appear across all AnswerOS pages and the sidebar.</p></div>
        <div class="s-grid2">
          <div class="s-field"><label>Full Name</label><input type="text" id="cfgName" value="${CONFIG.name}" /></div>
          <div class="s-field"><label>Email</label><input type="text" id="cfgEmail" value="${CONFIG.email}" /></div>
          <div class="s-field"><label>Role / Title</label><input type="text" id="cfgRole" value="${CONFIG.role}" /></div>
          <div class="s-field"><label>Status Emoji</label><input type="text" id="cfgEmoji" value="${CONFIG.emoji}" maxlength="4" /></div>
          <div class="s-field"><label>Optional Subject</label><input type="text" id="cfgOptional" value="${CONFIG.optionalSubject}" /></div>
          <div class="s-field"><label>Target Service</label><input type="text" id="cfgService" value="${CONFIG.targetService}" /></div>
          <div class="s-field"><label>Exam Year</label><input type="text" id="cfgExamYear" value="${CONFIG.examYear}" /></div>
        </div>
        <div class="save-bar"><p>Changes update the sidebar immediately.</p><button class="save-btn" id="saveProfile">Save Profile</button></div>
      </div>
    </div>`;
    document.getElementById('saveProfile').addEventListener('click', ()=>{
      CONFIG.name = document.getElementById('cfgName').value;
      CONFIG.email = document.getElementById('cfgEmail').value;
      CONFIG.role = document.getElementById('cfgRole').value;
      CONFIG.emoji = document.getElementById('cfgEmoji').value;
      CONFIG.optionalSubject = document.getElementById('cfgOptional').value;
      CONFIG.targetService = document.getElementById('cfgService').value;
      CONFIG.examYear = document.getElementById('cfgExamYear').value;
      document.getElementById('sidebarName').textContent = CONFIG.name;
      document.getElementById('sidebarRole').textContent = CONFIG.role + ' ' + CONFIG.emoji;
      document.getElementById('avatarDisplay').textContent = CONFIG.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      showToast('Profile saved.');
    });
  }

  else if(activeSection==='appearance'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Appearance</h3><p>Theme, text size, and visual density.</p></div>
        <div class="s-row">
          <div><div class="s-row-label">Theme</div><div class="s-row-sub">Applies immediately across all open pages this session.</div></div>
          <div class="seg">
            <button class="seg-btn ${CONFIG.theme==='light'?'active':''}" data-seg="theme" data-val="light">Light</button>
            <button class="seg-btn ${CONFIG.theme==='dark'?'active':''}" data-seg="theme" data-val="dark">Dark</button>
            <button class="seg-btn ${CONFIG.theme==='system'?'active':''}" data-seg="theme" data-val="system">System</button>
          </div>
        </div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div><div class="s-row-label">Font Size</div></div>
          <div class="seg">
            <button class="seg-btn ${CONFIG.fontSize==='small'?'active':''}" data-seg="fontSize" data-val="small">Small</button>
            <button class="seg-btn ${CONFIG.fontSize==='medium'?'active':''}" data-seg="fontSize" data-val="medium">Medium</button>
            <button class="seg-btn ${CONFIG.fontSize==='large'?'active':''}" data-seg="fontSize" data-val="large">Large</button>
          </div>
        </div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div><div class="s-row-label">Accent Colour</div><div class="s-row-sub">The green used for highlights and buttons.</div></div>
          <input type="color" id="cfgAccent" value="${CONFIG.accentColor}" style="width:44px;height:34px;border-radius:8px;border:1px solid var(--line);cursor:pointer;padding:2px;" />
        </div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div><div class="s-row-label">Show Motivational Quote in Sidebar</div></div>
          <div class="toggle ${CONFIG.sidebarQuote?'on':''}" id="togSidebarQuote"></div>
        </div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div><div class="s-row-label">Show "Sample" banners on estimated data</div><div class="s-row-sub">The amber banners flagging untracked fields like PYQ/Study Time.</div></div>
          <div class="toggle ${CONFIG.showSampleBanners?'on':''}" id="togSampleBanners"></div>
        </div>
      </div>
    </div>`;
    seg('theme', 'theme', applyTheme);
    seg('fontSize', 'fontSize', v=>{ document.body.style.fontSize = v==='small'?'13px':v==='large'?'15px':'14px'; });
    document.getElementById('cfgAccent').addEventListener('input', e=>{
      CONFIG.accentColor = e.target.value;
      document.documentElement.style.setProperty('--green-600', e.target.value);
    });
    toggle('togSidebarQuote', 'sidebarQuote', v=>{
      document.querySelector('.quote-card').style.display = v ? '' : 'none';
    });
    toggle('togSampleBanners', 'showSampleBanners');
  }

  else if(activeSection==='targets'){
    function daysLeft(d){ return Math.round((new Date(d)-new Date('2026-08-16'))/86400000); }
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Writing Targets</h3><p>Used by the Dashboard "Today's Goal" pill, Goals page defaults, and Analytics thresholds.</p></div>
        <div class="s-grid2">
          <div class="s-field"><label>Daily Answer Target</label>
            <div class="s-field-inline"><input type="number" id="cfgDaily" value="${CONFIG.dailyAnswerTarget}" min="1" max="10" /><span style="color:var(--ink-500);font-size:12px;">answers / day</span></div>
          </div>
          <div class="s-field"><label>Weekly Answer Target</label>
            <div class="s-field-inline"><input type="number" id="cfgWeekly" value="${CONFIG.weeklyAnswerTarget}" min="1" /><span style="color:var(--ink-500);font-size:12px;">answers / week</span></div>
          </div>
          <div class="s-field"><label>Monthly Answer Target</label>
            <div class="s-field-inline"><input type="number" id="cfgMonthly" value="${CONFIG.monthlyAnswerTarget}" min="1" /><span style="color:var(--ink-500);font-size:12px;">answers / month</span></div>
          </div>
          <div class="s-field"><label>Minimum Score Target</label>
            <div class="s-field-inline"><input type="number" id="cfgScore" value="${CONFIG.minScoreTarget}" min="1" max="10" step="0.5" /><span style="color:var(--ink-500);font-size:12px;">/ 10</span></div>
          </div>
        </div>
        <div class="save-bar"><p>These flow into the Dashboard and Analytics pages.</p><button class="save-btn" id="saveTargets">Save Targets</button></div>
      </div>
      <div class="s-card">
        <div class="s-card-head"><h3>Exam Dates</h3><p>Controls the countdown displayed on the Dashboard, Calendar and Goals pages.</p></div>
        <div class="s-grid2">
          <div class="s-field"><label>UPSC Prelims Date</label><input type="date" id="cfgPrelims" value="${CONFIG.prelims}" /></div>
          <div class="s-field"><label>UPSC Mains Date</label><input type="date" id="cfgMains" value="${CONFIG.mains}" /></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
          <div style="background:var(--green-50);border-radius:10px;padding:12px 14px;text-align:center;">
            <div style="font-size:22px;font-weight:800;color:var(--green-800);">${daysLeft(CONFIG.prelims)}</div>
            <div style="font-size:11px;color:var(--ink-500);">Days to Prelims</div>
          </div>
          <div style="background:var(--green-50);border-radius:10px;padding:12px 14px;text-align:center;">
            <div style="font-size:22px;font-weight:800;color:var(--green-800);">${daysLeft(CONFIG.mains)}</div>
            <div style="font-size:11px;color:var(--ink-500);">Days to Mains</div>
          </div>
        </div>
        <div class="save-bar"><p>Updates all countdowns immediately this session.</p><button class="save-btn" id="saveDates">Save Dates</button></div>
      </div>
    </div>`;
    document.getElementById('saveTargets').addEventListener('click', ()=>{
      CONFIG.dailyAnswerTarget = parseInt(document.getElementById('cfgDaily').value)||2;
      CONFIG.weeklyAnswerTarget = parseInt(document.getElementById('cfgWeekly').value)||10;
      CONFIG.monthlyAnswerTarget = parseInt(document.getElementById('cfgMonthly').value)||40;
      CONFIG.minScoreTarget = parseFloat(document.getElementById('cfgScore').value)||6;
      showToast('Targets saved.');
    });
    document.getElementById('saveDates').addEventListener('click', ()=>{
      CONFIG.prelims = document.getElementById('cfgPrelims').value;
      CONFIG.mains = document.getElementById('cfgMains').value;
      showToast('Exam dates saved.');
      renderPanel();
    });
  }

  else if(activeSection==='sync'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Live Sync — Google Sheet Web App</h3><p>Paste your Apps Script Web App URL here. Once you deploy these files on GitHub Pages, this will pull your latest sheet rows on demand or on a timer.</p></div>
        <div class="s-field"><label>Web App URL</label>
          <div class="sync-url-row">
            <input type="text" id="cfgSyncUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${CONFIG.syncUrl}" />
            <button class="sync-test-btn" id="testSyncBtn">Test</button>
          </div>
          <div class="sync-status" id="syncStatus"></div>
        </div>
        <div class="s-field"><label>Sync Token (optional)</label><input type="text" id="cfgSyncToken" placeholder="The SYNC_TOKEN you set in Script Properties" value="${CONFIG.syncToken}" /></div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div><div class="s-row-label">Auto-sync while page is open</div><div class="s-row-sub">Polls your sheet on a timer. Works only when hosted — not in Claude's preview.</div></div>
          <div class="toggle ${CONFIG.autoSyncEnabled?'on':''}" id="togAutoSync"></div>
        </div>
        <div class="s-row">
          <div><div class="s-row-label">Sync interval</div></div>
          <div class="seg">
            <button class="seg-btn ${CONFIG.syncIntervalMinutes===5?'active':''}" data-seg="syncInterval" data-val="5">5 min</button>
            <button class="seg-btn ${CONFIG.syncIntervalMinutes===15?'active':''}" data-seg="syncInterval" data-val="15">15 min</button>
            <button class="seg-btn ${CONFIG.syncIntervalMinutes===30?'active':''}" data-seg="syncInterval" data-val="30">30 min</button>
          </div>
        </div>
        <div class="save-bar"><p>URL is remembered in memory this session.</p><button class="save-btn" id="saveSyncSettings">Save</button></div>
      </div>
    </div>`;
    toggle('togAutoSync', 'autoSyncEnabled');
    seg('syncInterval', 'syncIntervalMinutes');
    document.getElementById('saveSyncSettings').addEventListener('click', ()=>{
      CONFIG.syncUrl = document.getElementById('cfgSyncUrl').value.trim();
      CONFIG.syncToken = document.getElementById('cfgSyncToken').value.trim();
      showToast('Sync settings saved.');
    });
    document.getElementById('testSyncBtn').addEventListener('click', async ()=>{
      const url = document.getElementById('cfgSyncUrl').value.trim();
      const token = document.getElementById('cfgSyncToken').value.trim();
      const statusEl = document.getElementById('syncStatus');
      if(!url){ statusEl.textContent = 'Paste your Web App URL first.'; statusEl.className='sync-status err'; return; }
      statusEl.textContent = 'Testing…'; statusEl.className='sync-status';
      try{
        const fullUrl = token ? url+'?token='+encodeURIComponent(token) : url;
        const res = await fetch(fullUrl, {mode:'cors'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const data = await res.json();
        if(!data.ok) throw new Error(data.error||'Unknown error');
        statusEl.textContent = `✓ Connected — ${data.rows.length} rows returned.`;
        statusEl.className='sync-status ok';
      }catch(e){
        statusEl.textContent = `Connection failed: ${e.message}. Expected in Claude's preview — will work once hosted.`;
        statusEl.className='sync-status err';
      }
    });
  }

  else if(activeSection==='pages'){
    const pageList = [
      ['dashboard', 'Dashboard'],['allAnswers', 'All Answers'],['analytics', 'Analytics'],
      ['pyqTracker', 'PYQ Tracker'],['learnings', 'Learnings'],['revisionHub', 'Revision Hub'],
      ['flashcards', 'Flashcards'],['calendar', 'Calendar'],['goals', 'Goals'],
    ];
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Page Visibility</h3><p>Show or hide pages in the navigation. Hiding a page doesn't delete its data — just removes it from the sidebar.</p></div>
        ${pageList.map(([key, label])=>`
          <div class="s-row" style="border-bottom:1px solid var(--line);padding:10px 0;">
            <div><div class="s-row-label">${label}</div></div>
            <div class="toggle ${CONFIG.pagesVisible[key]?'on':''}" id="togPage_${key}" data-page="${key}"></div>
          </div>`).join('')}
        <div style="font-size:11.5px;color:var(--ink-500);margin-top:14px;">Note: hiding a page updates the sidebar on this Settings page immediately. Other open pages will reflect changes on next reload.</div>
      </div>
    </div>`;
    pageList.forEach(([key])=>{
      const el = document.getElementById('togPage_'+key);
      el.addEventListener('click', ()=>{
        CONFIG.pagesVisible[key] = !CONFIG.pagesVisible[key];
        el.classList.toggle('on', CONFIG.pagesVisible[key]);
        showToast(`${key} page ${CONFIG.pagesVisible[key]?'shown':'hidden'} in nav.`);
      });
    });
  }

  else if(activeSection==='quotes'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Motivational Quotes</h3><p>The quote that appears in your sidebar at the bottom. Choose from the list or add your own.</p></div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;" id="quoteList">
          ${CONFIG.customQuotes.map((q,i)=>`
            <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:1.5px solid ${CONFIG.activeQuoteIndex===i?'var(--green-600)':'var(--line)'};background:${CONFIG.activeQuoteIndex===i?'var(--green-50)':'#fff'};cursor:pointer;" data-qi="${i}">
              <div style="flex:1;font-size:12.5px;">${q}</div>
              ${CONFIG.activeQuoteIndex===i?'<span style="font-size:10px;font-weight:700;color:var(--green-700);background:var(--green-100);padding:2px 8px;border-radius:5px;">Active</span>':''}
              ${i>=4?`<button style="border:none;background:none;cursor:pointer;color:var(--ink-300);font-size:18px;line-height:1;" data-del="${i}">×</button>`:''}
            </div>`).join('')}
        </div>
        <div class="s-field">
          <label>Add a new quote</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="newQuote" placeholder="Write your own motivational quote…" style="flex:1;" />
            <button class="save-btn" id="addQuote">Add</button>
          </div>
        </div>
      </div>
    </div>`;
    document.querySelectorAll('[data-qi]').forEach(el=>{
      el.addEventListener('click', ()=>{
        CONFIG.activeQuoteIndex = parseInt(el.dataset.qi);
        document.getElementById('sidebarQuote').textContent = CONFIG.customQuotes[CONFIG.activeQuoteIndex];
        showToast('Quote updated in sidebar.');
        renderPanel();
      });
    });
    document.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', e=>{
        e.stopPropagation();
        const i = parseInt(el.dataset.del);
        CONFIG.customQuotes.splice(i,1);
        if(CONFIG.activeQuoteIndex>=CONFIG.customQuotes.length) CONFIG.activeQuoteIndex=0;
        renderPanel();
      });
    });
    document.getElementById('addQuote').addEventListener('click', ()=>{
      const val = document.getElementById('newQuote').value.trim();
      if(!val) return;
      CONFIG.customQuotes.push(val);
      CONFIG.activeQuoteIndex = CONFIG.customQuotes.length-1;
      document.getElementById('sidebarQuote').textContent = val;
      showToast('Quote added and set active.');
      renderPanel();
    });
  }

  else if(activeSection==='data'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>Export Settings</h3><p>Download your current Settings config as JSON — paste it back to restore everything.</p></div>
        <div style="display:flex;gap:10px;">
          <button class="save-btn" id="exportBtn">⬇ Export settings.json</button>
          <label for="importFile" class="save-btn" style="cursor:pointer;">⬆ Import settings.json</label>
          <input type="file" id="importFile" accept=".json" style="display:none;" />
        </div>
      </div>
      <div class="s-card">
        <div class="s-card-head"><h3>Danger Zone</h3><p>Irreversible actions. Think before clicking.</p></div>
        <div class="s-row">
          <div>
            <div class="s-row-label">Reset All Settings</div>
            <div class="s-row-sub">Restores all settings to their defaults this session.</div>
          </div>
          <button class="danger-btn" id="resetSettingsBtn">Reset Settings</button>
        </div>
        <div class="s-divider"></div>
        <div class="s-row">
          <div>
            <div class="s-row-label">Clear All Session State</div>
            <div class="s-row-sub">Clears Flashcard mastery, PYQ progress, Revision Hub state, and Goal progress from this session. Cannot be undone.</div>
          </div>
          <button class="danger-btn" id="clearStateBtn">Clear Session State</button>
        </div>
      </div>
    </div>`;
    document.getElementById('exportBtn').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(CONFIG, null, 2)], {type:'application/json'});
      const a = Object.assign(document.createElement('a'), {href:URL.createObjectURL(blob), download:'answeros-settings.json'});
      a.click(); showToast('Settings exported.');
    });
    document.getElementById('importFile').addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{ try{ Object.assign(CONFIG, JSON.parse(ev.target.result)); applyTheme(CONFIG.theme); renderPanel(); showToast('Settings imported.'); }catch(err){ showToast('Invalid JSON file.', 3500); } };
      reader.readAsText(file);
    });
    document.getElementById('resetSettingsBtn').addEventListener('click', ()=>{
      if(!confirm('Reset all settings to defaults?')) return;
      CONFIG.theme='light'; CONFIG.fontSize='medium'; CONFIG.accentColor='#2c8a46';
      CONFIG.dailyAnswerTarget=2; CONFIG.weeklyAnswerTarget=10;
      CONFIG.activeQuoteIndex=0; CONFIG.sidebarQuote=true;
      document.documentElement.style.setProperty('--green-600','#2c8a46');
      document.body.style.fontSize='';
      applyTheme('light');
      renderPanel(); showToast('Settings reset to defaults.');
    });
    document.getElementById('clearStateBtn').addEventListener('click', ()=>{
      if(!confirm('Clear all session state? This cannot be undone.')) return;
      showToast('Session state cleared. Reload any page to see changes.');
    });
  }

  else if(activeSection==='about'){
    c.innerHTML = `<div class="settings-panel active">
      <div class="s-card">
        <div class="s-card-head"><h3>AnswerOS</h3><p>Built entirely inside Claude by Aishwary Patil — July to August 2026.</p></div>
        <div class="about-grid">
          <div class="about-tile"><div class="av">10</div><div class="al">Total Pages</div></div>
          <div class="about-tile"><div class="av">12</div><div class="al">Real Answers Synced</div></div>
          <div class="about-tile"><div class="av">29</div><div class="al">Sheet Columns</div></div>
        </div>
        <div style="margin-top:16px;">
          <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);margin-bottom:8px;">All Pages</div>
          <div class="about-pages">
            ${['Dashboard','All Answers','Analytics','PYQ Tracker','Learnings','Revision Hub','Flashcards','Calendar','Goals','Settings'].map(p=>`<span class="about-page-chip">${p}</span>`).join('')}
          </div>
        </div>
        <div class="s-divider"></div>
        <div style="font-size:12px;color:var(--ink-500);line-height:1.7;">
          <b style="color:var(--ink-900);">Data source:</b> Google Sheets (SuperKalam → Gemini → Apps Script pipeline)<br>
          <b style="color:var(--ink-900);">Sync:</b> Apps Script <code>doGet()</code> Web App endpoint<br>
          <b style="color:var(--ink-900);">Hosting plan:</b> GitHub Pages (static, no backend needed)<br>
          <b style="color:var(--ink-900);">Sheet columns:</b> 29 (incl. Ideal Subheadings, Must-Have Points, Word Count, Marks Verified, Section Feedback)<br>
          <b style="color:var(--ink-900);">Built with:</b> Vanilla HTML/CSS/JS + Chart.js — zero frameworks, zero dependencies
        </div>
      </div>
    </div>`;
  }
}

renderPanel();
document.getElementById('avatarWrap').addEventListener('click', ()=>{ activeSection='profile'; document.querySelectorAll('.sn-item').forEach(el=>el.classList.toggle('active', el.dataset.section==='profile')); renderPanel(); });
</script>
</body>
</html>
