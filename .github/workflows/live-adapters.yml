name: Apply AnswerOS live adapters

on:
  push:
    branches: [main]
    paths:
      - 'scripts/live-sync-adapters.py'
      - '.github/workflows/live-adapters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply live adapters
        run: python3 scripts/live-sync-adapters.py

      - name: Commit generated adapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No adapter changes needed."
            exit 0
          fi
          git commit -m "Connect AnswerOS pages to shared sync store"
          git push
